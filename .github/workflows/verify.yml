name: Verify queue behavior
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Besitos.slnx
      - name: Tests without external services
        run: dotnet test src/Besitos.Tests --no-build --logger "trx;LogFileName=unit-tests.trx" --results-directory .artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          include-hidden-files: true
          path: .artifacts/unit-tests.trx
